<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rayliziie Official - Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#f97316',
                        darkbase: '#09090b',
                        cardbg: '#121216',
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #09090b; color: #f4f4f5; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-nav { background: rgba(9, 9, 11, 0.85); backdrop-filter: blur(16px); }
        .hero-gradient { background: linear-gradient(0deg, #09090b 0%, rgba(9,9,11,0.6) 50%, rgba(9,9,11,0) 100%); }
    </style>
</head>
<body class="pb-24 selection:bg-primary selection:text-white">

    <header class="sticky top-0 z-50 glass-nav border-b border-white/5 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-primary to-amber-500 flex items-center justify-center font-extrabold text-white text-sm shadow-lg shadow-primary/30">R</div>
            <h1 class="font-extrabold tracking-wider text-lg bg-gradient-to-r from-white via-gray-200 to-gray-400 bg-clip-text text-transparent">RAYLIZIIE</h1>
        </div>
    </header>

    <main class="px-4 pt-4">
        <!-- Hero -->
        <div id="hero-spotlight" class="relative w-full h-72 rounded-2xl overflow-hidden mb-6 shadow-2xl bg-cardbg border border-white/5 flex items-end">
            <div class="absolute inset-0">
                <img id="hero-img" src="https://placehold.co/600x400/121216/333?text=Loading..." class="w-full h-full object-cover opacity-60">
                <div class="absolute inset-0 hero-gradient"></div>
            </div>
            <div class="relative p-5 w-full">
                <span id="hero-badge" class="px-2.5 py-1 rounded-md bg-primary text-white text-xs font-bold uppercase tracking-wider mb-2 inline-block">Featured</span>
                <h2 id="hero-title" class="text-xl font-bold text-white mb-1 line-clamp-1">Selamat Datang</h2>
            </div>
        </div>

        <div id="submenu" class="flex gap-2 mb-6 overflow-x-auto no-scrollbar pb-1"></div>

        <h3 id="section-title" class="font-bold text-base text-white mb-4 flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-primary"></span> Konten
        </h3>

        <div id="content-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5">
            <div class="col-span-full py-16 text-center text-gray-500">Memuat data...</div>
        </div>
    </main>

    <nav class="fixed bottom-0 inset-x-0 glass-nav border-t border-white/10 z-50 px-6 py-2 flex justify-between items-center max-w-lg mx-auto">
        <button onclick="navigate('anime')" id="nav-btn-anime" class="nav-btn flex flex-col items-center gap-1 text-primary"><i class="ph ph-sword text-2xl"></i><span class="text-[10px] font-semibold">Anime</span></button>
        <button onclick="navigate('donghua')" id="nav-btn-donghua" class="nav-btn flex flex-col items-center gap-1 text-gray-400"><i class="ph ph-yin-yang text-2xl"></i><span class="text-[10px] font-semibold">Donghua</span></button>
        <button onclick="navigate('films')" id="nav-btn-films" class="nav-btn flex flex-col items-center gap-1 text-gray-400"><i class="ph ph-popcorn text-2xl"></i><span class="text-[10px] font-semibold">Films</span></button>
        <button onclick="navigate('drakor')" id="nav-btn-drakor" class="nav-btn flex flex-col items-center gap-1 text-gray-400"><i class="ph ph-heart text-2xl"></i><span class="text-[10px] font-semibold">Drakor</span></button>
    </nav>

    <script>
        const WORKER_URL = 'https://api-rayliziie.rayyankrens0304.workers.dev';
        let currentCategory = 'anime';

        function navigate(category) {
            currentCategory = category;
            document.querySelectorAll('.nav-btn').forEach(btn => { 
                btn.classList.remove('text-primary'); 
                btn.classList.add('text-gray-400'); 
            });
            const activeBtn = document.getElementById(`nav-btn-${category}`);
            if(activeBtn) { activeBtn.classList.remove('text-gray-400'); activeBtn.classList.add('text-primary'); }
            
            renderSubmenu(category);
            fetchContent(`/${category}/home`);
        }

        function renderSubmenu(cat) {
            const subs = ['Home', 'Genre', 'Schedule', 'Ongoing', 'List'];
            const container = document.getElementById('submenu');
            container.innerHTML = subs.map((item, idx) => `
                <button onclick="setActiveSub(this); fetchContent('/${cat}/${item.toLowerCase()}')" 
                class="sub-pill px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition border ${idx === 0 ? 'bg-primary border-primary text-white' : 'bg-cardbg border-white/5 text-gray-400'}">${item}</button>
            `).join('');
        }

        function setActiveSub(el) {
            document.querySelectorAll('.sub-pill').forEach(btn => {
                btn.classList.replace('bg-primary', 'bg-cardbg'); btn.classList.replace('border-primary', 'border-white/5'); btn.classList.replace('text-white', 'text-gray-400');
            });
            el.classList.replace('bg-cardbg', 'bg-primary'); el.classList.replace('border-white/5', 'border-primary'); el.classList.replace('text-gray-400', 'text-white');
        }

        async function fetchContent(path) {
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '<div class="col-span-full py-16 text-center text-gray-500">Memuat...</div>';
            
            try {
                const response = await fetch(`${WORKER_URL}${path}`);
                if (!response.ok) throw new Error(`Server Error: ${response.status}`);

                const result = await response.json();
                
                // Deep extraction of array regardless of API wrapping
                const items = Array.isArray(result) ? result : 
                            (result.data && Array.isArray(result.data) ? result.data : 
                            (result.result && Array.isArray(result.result) ? result.result : 
                            (result.list && Array.isArray(result.list) ? result.list : 
                            (result.data?.data && Array.isArray(result.data.data) ? result.data.data : []))));
                
                if(items.length === 0) {
                    grid.innerHTML = '<div class="col-span-full py-12 text-center text-gray-500">Data tidak ditemukan.</div>';
                } else {
                    renderCards(items);
                }
            } catch (err) {
                grid.innerHTML = `
                    <div class="col-span-full py-12 text-center text-red-500 text-sm">
                        <p class="mb-4">Koneksi ke server gagal (${err.message}).</p>
                        <button onclick="fetchContent('${path}')" class="bg-primary text-white px-6 py-2 rounded-lg font-bold">Coba Lagi</button>
                    </div>`;
            }
        }

        function renderCards(items) {
            const grid = document.getElementById('content-grid');
            const hero = items[0] || {};
            
            // Safe update of hero
            const heroImg = document.getElementById('hero-img');
            const heroTitle = document.getElementById('hero-title');
            if(heroImg) heroImg.src = hero?.poster || 'https://placehold.co/600x400/121216/333?text=RAYLIZIIE';
            if(heroTitle) heroTitle.innerText = hero?.title || 'Judul Tidak Tersedia';

            grid.innerHTML = items.map(item => `
                <div class="group bg-cardbg rounded-xl overflow-hidden border border-white/5 shadow-md flex flex-col active:scale-95 transition">
                    <div class="aspect-[3/4] w-full overflow-hidden bg-gray-900">
                        <img src="${item?.poster || 'https://placehold.co/300x450/111/444?text=No+Image'}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition">
                    </div>
                    <div class="p-3"><h3 class="font-bold text-xs text-white line-clamp-2">${item?.title || 'Unknown'}</h3></div>
                </div>
            `).join('');
        }

        navigate('anime');
    </script>
</body>
</html>
