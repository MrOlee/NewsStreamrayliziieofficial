<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raylizii - Streaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- GLOBAL STYLING --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0f0f11;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            padding-bottom: 80px;
        }
        a { text-decoration: none; color: inherit; }

        /* --- HEADER --- */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background-color: #1a1a1d;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid #2a2a2e;
        }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
        .brand-icon { color: #ff3b3b; }
        .brand-badge { background: #ff3b3b; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .search-btn { background: #2a2a2e; border: none; color: #aaa; padding: 8px 12px; border-radius: 8px; cursor: pointer; }

        /* --- HERO BANNER --- */
        .hero-banner {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            margin: 15px; padding: 25px; border-radius: 16px;
            position: relative; overflow: hidden;
        }
        .hero-badge { display: inline-block; background: #ff3b3b; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
        .hero-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; line-height: 1.2; }
        .hero-subtitle { color: #b0b0b0; font-size: 14px; margin-bottom: 20px; }
        .hero-tags { display: flex; gap: 10px; flex-wrap: wrap; }
        .hero-tag { background: rgba(255, 255, 255, 0.1); padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #ccc; border: 1px solid rgba(255, 255, 255, 0.05); }

        /* --- SECTION HEADER --- */
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-top: 25px; margin-bottom: 15px; }
        .section-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .section-link { font-size: 14px; color: #888; cursor: pointer; }
        .section-link:hover { color: #fff; }

        /* --- CARD CONTAINER & CARD STYLES --- */
        .card-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            padding: 0 20px;
        }
        .movie-card {
            background-color: #1a1a1d; border-radius: 12px; overflow: hidden;
            transition: transform 0.2s; cursor: pointer; border: 1px solid #252529;
        }
        .movie-card:hover { transform: translateY(-5px); border-color: #ff3b3b; }
        .card-image-container { width: 100%; aspect-ratio: 2/3; overflow: hidden; background: #2a2a2e; position: relative; }
        .card-image-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-info { padding: 10px; }
        .card-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-subtitle { font-size: 12px; color: #777; }

        /* --- FOOTER --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%; background-color: #1a1a1d;
            display: flex; justify-content: space-around; padding: 10px 0;
            border-top: 1px solid #2a2a2e; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #777; cursor: pointer; }
        .nav-item.active { color: #ff3b3b; }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }

        /* --- RESPONSIVE --- */
        @media (min-width: 600px) { .card-container { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 1024px) { .card-container { grid-template-columns: repeat(6, 1fr); } }
        
        /* --- CSS FOR FALLBACK IMAGE (Mengganti via.placeholder.com yang Error 503) --- */
        .fallback-image-box {
            width: 100%; height: 100%; display: flex; flex-direction: column;
            justify-content: center; align-items: center; background: #2a2a2e;
            color: #888; font-size: 14px; font-weight: bold; text-align: center; padding: 10px;
        }
        .fallback-image-box span { font-size: 12px; font-weight: normal; color: #555; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="brand">
            <span class="brand-icon">▶</span> Raylizii <span class="brand-badge">PRO</span>
        </div>
        <button class="search-btn">🔍</button>
    </header>

    <!-- HERO BANNER -->
    <section class="hero-banner">
        <div class="hero-badge">🔥 TRENDING</div>
        <h1 class="hero-title">Streaming Tanpa Batas</h1>
        <p class="hero-subtitle">Anime, Drama, Film, & Live TV dalam genggaman</p>
        <div class="hero-tags">
            <span class="hero-tag">10K+ Konten</span>
            <span class="hero-tag">6 Provider</span>
            <span class="hero-tag">4K UHD</span>
        </div>
    </section>

    <!-- SECTION 1: TRENDING -->
    <section>
        <div class="section-header">
            <h2 class="section-title">🔥 Trending</h2>
            <span class="section-link">Lihat semua</span>
        </div>
        <div id="trending-container" class="card-container">
            <!-- Loading Indicator -->
            <div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">⏳ Memuat data...</div>
        </div>
    </section>

    <!-- SECTION 2: ANIME -->
    <section>
        <div class="section-header">
            <h2 class="section-title">📺 Anime</h2>
            <span class="section-link">Lihat semua</span>
        </div>
        <div id="anime-container" class="card-container">
            <div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">⏳ Memuat data...</div>
        </div>
    </section>

    <!-- SECTION 3: DRAMA KOREA -->
    <section>
        <div class="section-header">
            <h2 class="section-title">🇰🇷 Drama Korea</h2>
            <span class="section-link">Lihat semua</span>
        </div>
        <div id="drama-container" class="card-container">
            <div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">⏳ Memuat data...</div>
        </div>
    </section>

    <!-- FOOTER -->
    <nav class="bottom-nav">
        <div class="nav-item active"><span class="nav-icon">🏠</span>Beranda</div>
        <div class="nav-item"><span class="nav-icon">📺</span>Anime</div>
        <div class="nav-item"><span class="nav-icon">🎬</span>Drama</div>
        <div class="nav-item"><span class="nav-icon">🎥</span>Film</div>
        <div class="nav-item"><span class="nav-icon">📡</span>TV Live</div>
    </nav>


    <!-- ============================================================== -->
    <!-- JAVASCRIPT - LOGIKA PENANGANAN ERROR 100% DIPERBAIKI           -->
    <!-- ============================================================== -->
    <script>
        // --- KONFIGURASI ---
        // GANTI URL INI DENGAN API ASLI ANDA
        const YOUR_API_URL = 'https://api-rayliziie.rayyankrens0304.workers.dev/'; 
        
        // --- DATA DUMMY (Cadangan jika API Anda error atau kosong) ---
        const FALLBACK_DATA = {
            trending: [
                { id: 1, title: "Judul Trending 1", image: null, type: "Movie" }, // null sengaja dibuat untuk tes error handler
                { id: 2, title: "Judul Trending 2", image: "/path/to/img.jpg", type: "Series" },
            ],
            anime: [{ id: 3, title: "Anime Populer", image: null, type: "Anime" }],
            drama: [{ id: 4, title: "Drama Korea Baru", image: null, type: "K-Drama" }]
        };

        // ===============================================================
        // 1. getImage (FIX UTAMA: MEMPERBAIKI ERROR url.startsWith)
        // ===============================================================
        function getImage(url) {
            // LAPIS PERTAHANAN PERTAMA:
            // Jika URL kosong/null/undefined, atau BUKAN string -> JANGAN panggil .startsWith()
            if (!url || typeof url !== 'string') {
                return null; // Kembalikan null agar fallback gambar dipicu
            }

            // Logika asli Anda hanya akan berjalan jika url BENAR-BENAR string
            if (url.startsWith('/')) {
                return window.location.origin + url;
            }

            return url;
        }

        // ===============================================================
        // 2. createCard (Menggunakan DOM element agar aman)
        // ===============================================================
        function createCard(item) {
            if (!item) return document.createElement('div'); // Kembalikan kosong jika data null

            const title = item.title || item.name || 'Tanpa Judul';
            const rawImage = item.image || item.poster || item.poster_path || null;
            
            // Dapatkan URL gambar yang sudah di-filter
            const safeImageUrl = getImage(rawImage);

            const card = document.createElement('div');
            card.className = 'movie-card';

            // --- LOGIKA GAMBAR ---
            let imageHtml = '';
            
            // Jika URL gambar valid
            if (safeImageUrl) {
                // Perhatikan onerror: Jika gambar dari API mati (seperti 503), ini akan memicu fallback
                imageHtml = `<img src="${safeImageUrl}" alt="${title}" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML=\`<div class='fallback-image-box'>🖼️<br>Gambar Error<span>Fallback Lokal</span></div>\`;">`;
            } 
            // Jika URL gambar null atau rusak sejak awal
            else {
                imageHtml = `<div class="fallback-image-box">🖼️<br>Tidak Ada Gambar<span>Fallback Lokal</span></div>`;
            }

            card.innerHTML = `
                <div class="card-image-container">
                    ${imageHtml}
                </div>
                <div class="card-info">
                    <h3 class="card-title">${title}</h3>
                    <p class="card-subtitle">${item.type || item.media_type || 'Unknown'}</p>
                </div>
            `;

            return card;
        }

        // ===============================================================
        // 3. renderRow (Membuat kartu di dalam HTML)
        // ===============================================================
        function renderRow(containerId, items) {
            const container = document.getElementById(containerId);
            if (!container) return;

            // Kosongkan container
            container.innerHTML = '';

            // Validasi Data: Jika items bukan array, atau kosong
            if (!items || !Array.isArray(items) || items.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">📭 Tidak ada data untuk ditampilkan.</div>`;
                return;
            }

            // Loop data dan masukkan ke DOM
            items.forEach(item => {
                if (item) {
                    const card = createCard(item);
                    container.appendChild(card);
                }
            });
        }

        // ===============================================================
        // 4. loadData (Mengambil data dari API)
        // ===============================================================
        async function loadData(sectionId, fallbackKey) {
            const container = document.getElementById(sectionId);
            
            try {
                // Coba fetch API
                const response = await fetch(YOUR_API_URL);
                
                if (!response.ok) throw new Error(`HTTP Status: ${response.status}`);
                
                const result = await response.json();
                
                // SESUAIKAN BAGIAN INI DENGAN STRUKTUR JSON API ANDA
                // Misal: let items = result.data; atau let items = result.results;
                let items = result.data || result.results || result; 

                // Jika items bukan array, ubah menjadi array
                if (!Array.isArray(items)) items = [items];

                renderRow(sectionId, items);

            } catch (error) {
                console.warn(`Gagal fetch API untuk ${sectionId}:`, error.message);
                
                // JIKA API GAGAL -> PAKAI DATA FALLBACK (Dummy) AGAR SITUS TIDAK KOSONG
                if (FALLBACK_DATA[fallbackKey]) {
                    renderRow(sectionId, FALLBACK_DATA[fallbackKey]);
                } else {
                    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ff6b6b; padding: 20px;">⚠️ Gagal memuat data: ${error.message}</div>`;
                }
            }
        }

        // ===============================================================
        // 5. EKSEKUSI SAAT HALAMAN SIAP
        // ===============================================================
        document.addEventListener('DOMContentLoaded', () => {
            // Panggil fungsi load untuk setiap section
            loadData('trending-container', 'trending');
            loadData('anime-container', 'anime');
            loadData('drama-container', 'drama');
        });
    </script>
</body>
</html>
