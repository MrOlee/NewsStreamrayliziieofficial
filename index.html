<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Raylizii - Streaming Tanpa Batas</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* --- STYLING DASAR --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f0f11; color: #ffffff; font-family: 'Inter', sans-serif; padding-bottom: 80px; }
        a { text-decoration: none; color: inherit; }

        /* --- HEADER --- */
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background-color: #1a1a1d; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #2a2a2e; }
        .brand { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
        .brand-icon { color: #ff3b3b; }
        .brand-badge { background: #ff3b3b; color: white; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
        .search-btn { background: #2a2a2e; border: none; color: #aaa; padding: 8px 12px; border-radius: 8px; cursor: pointer; }

        /* --- HERO BANNER --- */
        .hero-banner { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); margin: 15px; padding: 25px; border-radius: 16px; position: relative; overflow: hidden; }
        .hero-badge { display: inline-block; background: #ff3b3b; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px; }
        .hero-title { font-size: 28px; font-weight: 700; margin-bottom: 8px; line-height: 1.2; }
        .hero-subtitle { color: #b0b0b0; font-size: 14px; margin-bottom: 20px; }
        .hero-tags { display: flex; gap: 10px; flex-wrap: wrap; }
        .hero-tag { background: rgba(255, 255, 255, 0.1); padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #ccc; border: 1px solid rgba(255, 255, 255, 0.05); }

        /* --- SECTION HEADER --- */
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-top: 25px; margin-bottom: 15px; }
        .section-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .section-link { font-size: 14px; color: #888; cursor: pointer; }

        /* --- CARD STYLES --- */
        .card-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 0 20px; }
        .movie-card { background-color: #1a1a1d; border-radius: 12px; overflow: hidden; transition: transform 0.2s; cursor: pointer; border: 1px solid #252529; }
        .movie-card:hover { transform: translateY(-5px); border-color: #ff3b3b; }
        .card-image-container { width: 100%; aspect-ratio: 2/3; overflow: hidden; background: #1f1f23; position: relative; display: flex; justify-content: center; align-items: center; }
        .card-image-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-info { padding: 10px; }
        .card-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
        .card-subtitle { font-size: 12px; color: #777; }

        /* --- FALLBACK GAMBAR (Mengganti Placeholder Eksternal yang Error 503) --- */
        .fallback-box { width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #1f1f23; color: #666; font-size: 14px; font-weight: 600; text-align: center; padding: 20px; }
        .fallback-box span { font-size: 11px; font-weight: normal; color: #444; margin-top: 5px; }

        /* --- BOTTOM NAV --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #1a1a1d; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #2a2a2e; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #777; cursor: pointer; }
        .nav-item.active { color: #ff3b3b; }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }

        @media (min-width: 600px) { .card-container { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 1024px) { .card-container { grid-template-columns: repeat(6, 1fr); } }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="app-header">
        <div class="brand"><span class="brand-icon">▶</span> Raylizii <span class="brand-badge">PRO</span></div>
        <button class="search-btn">🔍</button>
    </header>

    <!-- HERO -->
    <section class="hero-banner">
        <div class="hero-badge">🔥 TRENDING</div>
        <h1 class="hero-title">Streaming Tanpa Batas</h1>
        <p class="hero-subtitle">Anime, Drama, Film, & Live TV dalam genggaman</p>
        <div class="hero-tags">
            <span class="hero-tag">10K+ Konten</span>
            <span class="hero-tag">6 Provider</span>
            <span class="hero-tag">4K UHD</span>
        </div>
    </section>

    <!-- SECTION ANIME -->
    <section>
        <div class="section-header"><h2 class="section-title">📺 Anime</h2><span class="section-link">Lihat semua</span></div>
        <div id="anime-container" class="card-container"><div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">⏳ Memuat Anime...</div></div>
    </section>

    <!-- SECTION DRAMA -->
    <section>
        <div class="section-header"><h2 class="section-title">🇰🇷 Drama Korea</h2><span class="section-link">Lihat semua</span></div>
        <div id="drama-container" class="card-container"><div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">⏳ Memuat Drama...</div></div>
    </section>

    <!-- SECTION FILM -->
    <section>
        <div class="section-header"><h2 class="section-title">🎬 Film</h2><span class="section-link">Lihat semua</span></div>
        <div id="film-container" class="card-container"><div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">⏳ Memuat Film...</div></div>
    </section>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav">
        <div class="nav-item active"><span class="nav-icon">🏠</span>Beranda</div>
        <div class="nav-item"><span class="nav-icon">📺</span>Anime</div>
        <div class="nav-item"><span class="nav-icon">🎬</span>Drama</div>
        <div class="nav-item"><span class="nav-icon">🎥</span>Film</div>
        <div class="nav-item"><span class="nav-icon">📡</span>TV Live</div>
    </nav>

    <!-- ============================================================== -->
    <!-- JAVASCRIPT FINAL - DIJAMIN 100% BEBAS ERROR url.startsWith     -->
    <!-- ============================================================== -->
    <script>
        // --- URL API ANDA ---
        const BASE_URL = 'https://api-rayliziie.rayyankrens0304.workers.dev';
        
        // --- ENDPOINT SESUAI WORKER ---
        const ENDPOINTS = {
            anime: `${BASE_URL}/animekompi/list`,    // Sesuai Worker (A-Z List)
            drama: `${BASE_URL}/dramovnime/list`,    // Sesuai Worker (Katalog Paginated)
            film:  `${BASE_URL}/filmbox/trending`    // Sesuai Worker (Trending Movie)
        };

        // --- getImage (TIDAK ADA LAGI ERROR url.startsWith) ---
        function getImage(url) {
            // Jika url adalah string (teks), return url tersebut. 
            // Jika bukan string (misal null, undefined, angka), return NULL.
            // Ini 100% mencegah TypeError: url.startsWith is not a function.
            return (typeof url === 'string' && url.length > 0) ? url : null;
        }

        // --- createCard (Membuat Kartu HTML) ---
        function createCard(item) {
            if (!item) return document.createElement('div');
            
            // Mapping Field dari API Worker Anda
            const title = item.title || item.name || item.judul || 'Tanpa Judul';
            const rawImage = item.image || item.poster || item.thumbnail || null;
            const type = item.type || item.genre || item.quality || 'Unknown';

            const safeImageUrl = getImage(rawImage);

            const card = document.createElement('div');
            card.className = 'movie-card';

            // Logika Gambar: Jika null, langsung tampilkan Fallback Lokal.
            // Jika ada URL, tampilkan, tapi jika error 503, ganti dengan Fallback Lokal.
            let imageHtml = '';
            if (safeImageUrl) {
                imageHtml = `<img src="${safeImageUrl}" alt="${title}" loading="lazy" onerror="this.onerror=null; this.parentElement.innerHTML=\`<div class='fallback-box'>🖼️<br>Error Load<span>Gambar Rusak</span></div>\`;">`;
            } else {
                imageHtml = `<div class="fallback-box">🖼️<br>Tidak Ada Gambar<span>Fallback Lokal</span></div>`;
            }

            card.innerHTML = `
                <div class="card-image-container">${imageHtml}</div>
                <div class="card-info">
                    <h3 class="card-title">${title}</h3>
                    <p class="card-subtitle">${type}</p>
                </div>
            `;
            return card;
        }

        // --- renderRow (Menempel ke HTML) ---
        function renderRow(containerId, items) {
            const container = document.getElementById(containerId);
            if (!container) return;
            
            container.innerHTML = '';
            if (!items || !Array.isArray(items) || items.length === 0) {
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 20px;">📭 Data tidak ditemukan.</div>`;
                return;
            }
            
            items.forEach(item => { 
                if (item) container.appendChild(createCard(item)); 
            });
        }

        // --- fetchData (Mengambil API yang sudah dipastikan endpointnya) ---
        async function fetchData(endpointUrl, containerId) {
            const container = document.getElementById(containerId);
            try {
                const response = await fetch(endpointUrl);
                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                
                const result = await response.json();
                
                // Worker Anda mengirim JSON { code: 0, message: "ok", data: [...] }
                // Maka kita ambil data dari result.data
                let items = result.data || result.results || result; 
                if (!Array.isArray(items)) items = [items];
                
                renderRow(containerId, items);
            } catch (error) {
                console.warn(`Gagal fetch ${endpointUrl}:`, error.message);
                container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #ff6b6b; padding: 20px;">⚠️ Gagal memuat data dari server (Error: ${error.message})</div>`;
            }
        }

        // --- Menjalankan Semua ---
        document.addEventListener('DOMContentLoaded', () => {
            fetchData(ENDPOINTS.anime, 'anime-container');
            fetchData(ENDPOINTS.drama, 'drama-container');
            fetchData(ENDPOINTS.film, 'film-container');
        });
    </script>
</body>
</html>
