<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rayliziie Official</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#0b0b12" />
</head>
<body>

  <!-- LOADING -->
  <div id="loader" class="loader-overlay">
    <div class="spinner"></div>
    <p>Memuat...</p>
  </div>

  <!-- MAIN APP -->
  <div id="app">

    <!-- HEADER -->
    <header class="app-header">
      <div class="header-left">
        <span class="logo-icon">▶</span>
        <span class="logo-text">Rayliziie</span>
        <span class="badge-pro">PRO</span>
      </div>
      <div class="header-right">
        <button id="searchToggle" class="icon-btn">🔍</button>
      </div>
    </header>

    <!-- SEARCH BAR (toggle) -->
    <div id="searchBar" class="search-bar hidden">
      <input type="text" id="searchInput" placeholder="Cari judul..." />
      <button id="searchBtn">Cari</button>
    </div>

    <!-- MAIN CONTENT -->
    <main id="mainContent">
      <!-- Pages: home, anime, drama, film, tv -->
      <section id="page-home" class="page active">
        <!-- Hero -->
        <div class="hero-card">
          <div class="hero-badge">🔥 TRENDING</div>
          <h1 class="hero-title">Streaming Tanpa Batas</h1>
          <p class="hero-desc">Anime, Drama, Film, & Live TV dalam genggaman</p>
          <div class="hero-stats">
            <span>10K+ Konten</span>
            <span>6 Provider</span>
            <span>4K UHD</span>
          </div>
        </div>

        <!-- Rows -->
        <div class="row">
          <div class="row-header">
            <h2>🔥 Trending</h2>
            <a href="#" class="view-all" data-page="anime">Lihat semua</a>
          </div>
          <div class="row-scroll" id="trendingRow"></div>
        </div>

        <div class="row">
          <div class="row-header">
            <h2>📺 Anime</h2>
            <a href="#" class="view-all" data-page="anime">Lihat semua</a>
          </div>
          <div class="row-scroll" id="animeRow"></div>
        </div>

        <div class="row">
          <div class="row-header">
            <h2>🎬 Drama Korea</h2>
            <a href="#" class="view-all" data-page="drama">Lihat semua</a>
          </div>
          <div class="row-scroll" id="dramaRow"></div>
        </div>

        <div class="row">
          <div class="row-header">
            <h2>🎥 Film</h2>
            <a href="#" class="view-all" data-page="film">Lihat semua</a>
          </div>
          <div class="row-scroll" id="filmRow"></div>
        </div>

        <!-- Schedule -->
        <div class="schedule-card">
          <div class="row-header">
            <h2>📅 Jadwal Rilis</h2>
            <span id="scheduleDate" class="schedule-update">Update: ...</span>
          </div>
          <div id="scheduleList" class="schedule-list"></div>
        </div>

        <!-- Provider Status -->
        <div class="provider-card">
          <div class="row-header">
            <h2>🔌 Provider</h2>
            <span class="status-badge">● Online</span>
          </div>
          <div id="providerList" class="provider-grid"></div>
        </div>
      </section>

      <!-- Other pages (anime, drama, film, tv) will be populated dynamically -->
      <section id="page-anime" class="page"></section>
      <section id="page-drama" class="page"></section>
      <section id="page-film" class="page"></section>
      <section id="page-tv" class="page"></section>
    </main>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Beranda</span>
      </button>
      <button class="nav-item" data-page="anime">
        <span class="nav-icon">🎌</span>
        <span class="nav-label">Anime</span>
      </button>
      <button class="nav-item" data-page="drama">
        <span class="nav-icon">🎭</span>
        <span class="nav-label">Drama</span>
      </button>
      <button class="nav-item" data-page="film">
        <span class="nav-icon">🎬</span>
        <span class="nav-label">Film</span>
      </button>
      <button class="nav-item" data-page="tv">
        <span class="nav-icon">📺</span>
        <span class="nav-label">TV Live</span>
      </button>
    </nav>
  </div>

  <!-- MODAL PLAYER -->
  <div id="playerModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span id="modalTitle">Judul</span>
        <button id="closeModal" class="modal-close">✕</button>
      </div>
      <div class="modal-body">
        <div class="video-wrapper">
          <video id="videoPlayer" controls></video>
        </div>
        <div class="video-meta">
          <span class="quality" id="videoQuality">HD</span>
          <span id="videoYear">2024</span>
        </div>
        <p id="videoDesc" class="video-desc"></p>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
