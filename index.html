<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rayliziie | Official Streaming</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 500: '#6366f1', 600: '#4f46e5' }, darkbg: '#0b0d14', darkcard: '#131722', darkborder: '#1f293d' } } }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0d14; color: #f3f4f6; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(19, 23, 34, 0.8); backdrop-filter: blur(12px); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <header class="sticky top-0 z-50 glass border-b border-white/5 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <h1 class="text-xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">RAYLIZIIE</h1>
        </div>
        <div class="relative">
            <input type="text" id="search-input" placeholder="Cari..." class="bg-white/5 border border-white/10 rounded-full py-1.5 pl-4 pr-10 text-xs w-40 focus:outline-none focus:border-indigo-500">
        </div>
    </header>

    <main class="max-w-lg mx-auto p-4">
        <div id="hero" class="relative w-full aspect-video rounded-2xl overflow-hidden mb-6 shadow-2xl">
            <div class="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
            <div class="absolute bottom-4 left-4">
                <span class="text-[10px] font-bold bg-indigo-600 px-2 py-0.5 rounded text-white">LATEST</span>
                <h2 class="text-lg font-bold text-white mt-1" id="hero-title">Loading...</h2>
            </div>
        </div>

        <section class="mb-6">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-sm">Terpopuler</h3>
            </div>
            <div id="content-grid" class="grid grid-cols-2 gap-4">
                <!-- Data will load here -->
            </div>
        </section>
    </main>

    <nav class="fixed bottom-0 left-0 w-full glass border-t border-white/5 p-3 flex justify-around z-50">
        <button onclick="switchCategory('anime')" class="flex flex-col items-center gap-1"><i class="ph ph-sword text-lg"></i><span class="text-[9px]">Anime</span></button>
        <button onclick="switchCategory('donghua')" class="flex flex-col items-center gap-1"><i class="ph ph-yin-yang text-lg"></i><span class="text-[9px]">Donghua</span></button>
        <button onclick="switchCategory('films')" class="flex flex-col items-center gap-1"><i class="ph ph-film-strip text-lg"></i><span class="text-[9px]">Film</span></button>
        <button onclick="switchCategory('drakor')" class="flex flex-col items-center gap-1"><i class="ph ph-heart text-lg"></i><span class="text-[9px]">Drakor</span></button>
    </nav>

    <script>
        const API = 'https://api-rayliziie.rayyankrens0304.workers.dev';
        let items = [];

        async function switchCategory(cat) {
            const grid = document.getElementById('content-grid');
            grid.innerHTML = '<div class="col-span-2 text-center text-xs py-10">Loading...</div>';
            try {
                const res = await fetch(`${API}/${cat}/home`);
                const data = await res.json();
                items = data.slice(0, 10);
                render(items);
            } catch(e) {
                grid.innerHTML = '<div class="col-span-2 text-center text-xs py-10 text-red-400">Offline/Error</div>';
            }
        }

        function render(data) {
            const grid = document.getElementById('content-grid');
            const heroTitle = document.getElementById('hero-title');
            if(data[0]) heroTitle.innerText = data[0].title || 'Tontonan Pilihan';
            
            grid.innerHTML = data.map(i => `
                <div class="bg-darkcard rounded-xl overflow-hidden">
                    <div class="aspect-[2/3] bg-white/5 relative">
                        <img src="${i.cover_url || i.poster}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/200x300/131722/6366f1?text=No+Img'">
                    </div>
                    <div class="p-2"><h4 class="text-[11px] font-bold line-clamp-1">${i.title || i.name}</h4></div>
                </div>
            `).join('');
        }

        switchCategory('anime');
    </script>
</body>
</html>
