<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rayliziie Debug</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0b0b12;
      color: #f0f0f5;
      font-family: 'Inter', sans-serif;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    .debug-box {
      background: #16161f;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      overflow-x: auto;
    }
    .debug-box h3 {
      color: #e50914;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .debug-box .status {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-left: 8px;
    }
    .debug-box .status.ok {
      background: rgba(0, 255, 136, 0.12);
      color: #00ff88;
    }
    .debug-box .status.fail {
      background: rgba(255, 0, 0, 0.12);
      color: #ff6b6b;
    }
    .debug-box pre {
      font-size: 10px;
      color: #9a9ab0;
      white-space: pre-wrap;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      max-height: 300px;
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 8px;
      margin-top: 8px;
    }
    .debug-box .field-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }
    .debug-box .field-tag {
      background: rgba(229, 9, 20, 0.12);
      color: #e50914;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .card-preview {
      background: #16161f;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      display: flex;
      gap: 12px;
      padding: 12px;
    }
    .card-preview img {
      width: 80px;
      height: 120px;
      object-fit: cover;
      border-radius: 6px;
      background: #0b0b12;
      flex-shrink: 0;
    }
    .card-preview .info {
      flex: 1;
    }
    .card-preview .info .title {
      font-weight: 700;
      font-size: 14px;
    }
    .card-preview .info .fields {
      font-size: 10px;
      color: #9a9ab0;
      margin-top: 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .card-preview .info .fields span {
      background: rgba(255, 255, 255, 0.04);
      padding: 2px 8px;
      border-radius: 4px;
    }
    .loader {
      text-align: center;
      padding: 40px 0;
      color: #9a9ab0;
    }
    .spinner {
      display: inline-block;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(229, 9, 20, 0.15);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }
    h1 span {
      color: #e50914;
      font-size: 12px;
      background: rgba(229, 9, 20, 0.12);
      padding: 2px 12px;
      border-radius: 20px;
    }
    .subtitle {
      color: #9a9ab0;
      font-size: 13px;
      margin-bottom: 20px;
    }
    .section-title {
      font-size: 18px;
      margin: 20px 0 12px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <h1>▶ Rayliziie <span>DEBUG</span></h1>
  <p class="subtitle">Menampilkan struktur asli response dari API</p>

  <div id="app">
    <div class="loader">
      <div class="spinner"></div>
      <p style="margin-top:12px;">Memuat data dari API...</p>
    </div>
  </div>

  <script>
    // ================================================================
    // DEBUG - SHOW RAW API RESPONSE
    // ================================================================

    const API = 'https://api-rayliziie.rayyankrens0304.workers.dev';
    const app = document.getElementById('app');

    async function debugAPI() {
      let html = '';

      // List endpoints to test
      const endpoints = [
        { name: '📺 Anime (list)', path: '/animekompi/list', method: 'GET' },
        { name: '📺 Anime (home)', path: '/animekompi/home', method: 'GET' },
        { name: '🎭 Drama (list POST)', path: '/dramovnime/list', method: 'POST', body: { page: 1, limit: 10 } },
        { name: '🎬 Film (home)', path: '/filmbox/home', method: 'GET' },
        { name: '📺 TV (channels)', path: '/vidio/channels', method: 'GET' },
        { name: '📅 Schedule', path: '/animekompi/schedule', method: 'GET' },
        { name: '🔌 Root Info', path: '/', method: 'GET' },
      ];

      for (const ep of endpoints) {
        try {
          const opts = {
            method: ep.method,
            headers: { 'Content-Type': 'application/json' },
          };
          if (ep.body) opts.body = JSON.stringify(ep.body);

          const res = await fetch(`${API}${ep.path}`, opts);
          const status = res.status;
          const data = await res.json();

          const isOk = status >= 200 && status < 300;

          html += `
            <div class="debug-box">
              <h3>
                ${ep.name}
                <span class="status ${isOk ? 'ok' : 'fail'}">${status}</span>
              </h3>
              <div style="font-size:11px;color:#9a9ab0;margin-bottom:6px;">
                ${ep.method} ${ep.path}
              </div>
              <div class="field-list">
                ${Object.keys(data).map(k => `<span class="field-tag">${k}</span>`).join('')}
              </div>
              <pre>${JSON.stringify(data, null, 2)}</pre>
            </div>
          `;

          // Try to find items array
          const items = findItems(data);
          if (items && items.length > 0) {
            const first = items[0];
            html += `
              <div class="debug-box" style="border-color:rgba(0,255,136,0.2);">
                <h3 style="color:#00ff88;">✅ ${items.length} items ditemukan</h3>
                <div style="font-size:12px;color:#9a9ab0;margin-bottom:6px;">
                  Field yang tersedia di setiap item:
                </div>
                <div class="field-list">
                  ${Object.keys(first).map(k => `<span class="field-tag">${k}: ${typeof first[k]}</span>`).join('')}
                </div>
                <pre>${JSON.stringify(first, null, 2)}</pre>
              </div>
            `;

            // Preview cards
            html += `<div class="section-title">📺 Preview (${Math.min(items.length, 6)} dari ${items.length})</div>`;
            items.slice(0, 6).forEach((item, idx) => {
              // Try to find title and image from any field
              const title = item.title || item.name || item.judul || 
                           item.anime_title || item.movie_title || 
                           Object.values(item).find(v => typeof v === 'string' && v.length > 3 && v.length < 100) || 
                           'No Title';
              const img = item.poster || item.thumbnail || item.image || 
                          item.cover || item.img || item.picture || item.photo || '';
              const allFields = Object.keys(item).join(' • ');

              html += `
                <div class="card-preview">
                  <img src="${img}" alt="${title}" onerror="this.src='https://via.placeholder.com/80x120/16161f/9a9ab0?text=No+Image'" />
                  <div class="info">
                    <div class="title">${title}</div>
                    <div style="font-size:11px;color:#9a9ab0;margin-top:2px;">
                      ${Object.entries(item).filter(([k,v]) => typeof v === 'string' && v.length < 50 && k !== 'title' && k !== 'name' && k !== 'judul').slice(0, 3).map(([k,v]) => `${k}: ${v}`).join(' • ')}
                    </div>
                    <div class="fields">
                      <span>Fields: ${allFields}</span>
                    </div>
                  </div>
                </div>
              `;
            });
          } else {
            html += `
              <div class="debug-box" style="border-color:rgba(255,200,0,0.2);">
                <h3 style="color:#ffcc00;">⚠️ Tidak ada array data ditemukan</h3>
                <div style="font-size:12px;color:#9a9ab0;">
                  Response tidak mengandung array di field: data, items, results, list, channels, dll
                </div>
              </div>
            `;
          }

        } catch (err) {
          html += `
            <div class="debug-box" style="border-color:#ff6b6b;">
              <h3 style="color:#ff6b6b;">❌ ${ep.name} — Error</h3>
              <pre style="color:#ff6b6b;">${err.message}</pre>
            </div>
          `;
        }
      }

      app.innerHTML = html;
    }

    // ---- Find items in response ----
    function findItems(data) {
      if (!data) return [];
      if (Array.isArray(data)) return data;

      const keys = ['data', 'items', 'results', 'list', 'channels', 'anime', 'movies', 'dramas', 'shows', 'contents', 'videos', 'episodes'];
      for (const k of keys) {
        if (data[k] && Array.isArray(data[k]) && data[k].length > 0) {
          return data[k];
        }
      }

      // Cari array apapun
      for (const k in data) {
        if (Array.isArray(data[k]) && data[k].length > 0) {
          return data[k];
        }
      }

      return [];
    }

    // ---- RUN ----
    debugAPI();
  </script>

</body>
</html>
