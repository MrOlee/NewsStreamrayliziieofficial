<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raylizii</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reset Dasar */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #0f0f11; color: #fff; font-family: 'Inter', sans-serif; padding-bottom: 80px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: #1a1a1d; border-bottom: 1px solid #333; }
        .brand { font-weight: 700; font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .brand i { color: #ff3b3b; }
        
        /* Hero */
        .hero { background: linear-gradient(135deg, #1f1f2e, #16162a); margin: 15px; padding: 20px; border-radius: 16px; }
        .hero h1 { font-size: 24px; margin-bottom: 5px; }
        .hero p { color: #aaa; font-size: 14px; margin-bottom: 15px; }
        
        /* Section */
        .section { padding: 0 15px; margin-top: 20px; }
        .section h2 { font-size: 18px; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        
        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        
        /* Card */
        .card { background: #1a1a1d; border-radius: 10px; overflow: hidden; border: 1px solid #333; }
        .card-img-box { width: 100%; aspect-ratio: 2/3; background: #222; display: flex; align-items: center; justify-content: center; color: #555; font-size: 13px; text-align: center; padding: 10px; }
        .card-img-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .card-info { padding: 8px; }
        .card-info h3 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-info p { color: #888; font-size: 11px; margin-top: 2px; }
        
        .footer { position: fixed; bottom: 0; width: 100%; background: #1a1a1d; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #333; }
        .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #777; }
        .nav-item.active { color: #ff3b3b; }
        .nav-item span { font-size: 20px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand"><i>▶</i> Raylizii <span style="background:#ff3b3b; font-size:9px; padding:1px 5px; border-radius:3px;">PRO</span></div>
        <button style="background:#333; border:none; color:#aaa; padding:5px 10px; border-radius:6px;">🔍</button>
    </div>

    <div class="hero">
        <span style="background:#ff3b3b; padding:2px 10px; border-radius:20px; font-size:10px; font-weight:bold;">🔥 TRENDING</span>
        <h1>Streaming Tanpa Batas</h1>
        <p>Anime, Drama, Film, & Live TV</p>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <span style="background:rgba(255,255,255,0.1); padding:4px 12px; border-radius:20px; font-size:11px;">10K+ Konten</span>
            <span style="background:rgba(255,255,255,0.1); padding:4px 12px; border-radius:20px; font-size:11px;">6 Provider</span>
        </div>
    </div>

    <div class="section">
        <h2>🔥 Trending</h2>
        <div id="trending-grid" class="grid"><div style="grid-column:1/-1; text-align:center; color:#666; padding:20px;">⏳ Memuat...</div></div>
    </div>

    <div class="section">
        <h2>📺 Anime</h2>
        <div id="anime-grid" class="grid"><div style="grid-column:1/-1; text-align:center; color:#666; padding:20px;">⏳ Memuat...</div></div>
    </div>

    <div class="section">
        <h2>🇰🇷 Drama Korea</h2>
        <div id="drama-grid" class="grid"><div style="grid-column:1/-1; text-align:center; color:#666; padding:20px;">⏳ Memuat...</div></div>
    </div>

    <div class="footer">
        <div class="nav-item active"><span>🏠</span>Beranda</div>
        <div class="nav-item"><span>📺</span>Anime</div>
        <div class="nav-item"><span>🎬</span>Drama</div>
        <div class="nav-item"><span>🎥</span>Film</div>
        <div class="nav-item"><span>📡</span>Live</div>
    </div>

    <script>
        // API Anda
        const BASE = 'https://api-rayliziie.rayyankrens0304.workers.dev';
        
        // Fungsi keamanan tertinggi untuk menghancurkan error url.startsWith
        function getSafeUrl(data) {
            // Jika data kosong, null, undefined, atau bukan string, return null (Tidak akan crash)
            if (!data || typeof data !== 'string' || data.trim() === '') {
                return null;
            }
            return data;
        }

        function createCard(item) {
            if(!item) return '';
            
            // Handle data yang aman
            const title = item.title || item.name || 'Tanpa Judul';
            const poster = getSafeUrl(item.image) || getSafeUrl(item.poster) || getSafeUrl(item.thumbnail);

            // Pastikan gambar yang akan ditampilkan
            let imgHtml = `<div class="card-img-box">🖼️ No Image</div>`;
            if(poster) {
                imgHtml = `<div class="card-img-box"><img src="${poster}" alt="${title}" onerror="this.parentElement.innerHTML='🖼️ Error Load'"></div>`;
            }

            return `
                <div class="card">
                    ${imgHtml}
                    <div class="card-info">
                        <h3>${title}</h3>
                        <p>${item.type || item.genre || 'Movie'}</p>
                    </div>
                </div>
            `;
        }

        async function loadData(endpoint, containerId) {
            const el = document.getElementById(containerId);
            try {
                const res = await fetch(endpoint);
                if(!res.ok) throw new Error('Gagal');
                const json = await res.json();
                
                // Worker Anda ngasih data di json.data
                let items = json.data || json.results || json;
                if(!Array.isArray(items)) items = [items];

                el.innerHTML = items.map(item => createCard(item)).join('');
            } catch(e) {
                el.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:#ff6b6b; padding:20px;">⚠️ Server Down</div>`;
            }
        }

        // Jika halaman sudah siap, jalankan
        document.addEventListener('DOMContentLoaded', () => {
            // Sesuai worker Anda: /animekompi/list, /dramovnime/list, /filmbox/trending
            loadData(`${BASE}/animekompi/list`, 'anime-grid');
            loadData(`${BASE}/dramovnime/list`, 'drama-grid');
            loadData(`${BASE}/filmbox/trending`, 'trending-grid');
        });
    </script>
</body>
</html>
